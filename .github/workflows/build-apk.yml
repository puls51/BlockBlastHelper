
name: Build Block Blast APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q BlockBlastHelper-starter.zip -d project

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          p = "project/app/build.gradle.kts"
          s = open(p).read()
          s = s.replace(
              '    defaultConfig {',
              '    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = "17" }\n    defaultConfig {'
          )
          open(p, "w").write(s)
          PY

      - name: Build APK
        run: gradle -p project --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastHelper-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
